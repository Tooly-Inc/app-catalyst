<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Leads — Tooly</title>

    <!-- Garde d'authentification Catalyst -->
    <script src="https://static.zohocdn.com/catalyst/sdk/js/4.4.0/catalystWebSDK.js"></script>
    <script src="/__catalyst/sdk/init.js"></script>
    <script>
      window.catalyst.auth.isUserAuthenticated().catch(function () {
        window.location.href = "/__catalyst/auth/login";
      });
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- HERO signature Tooly -->
      <header class="hero">
        <div class="hero-top">
          <div class="brand">
            <span class="logo-picto" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 721.94 721.94"
              >
                <rect
                  fill="#211d24"
                  x="150.97"
                  y="150.97"
                  width="420"
                  height="420"
                  rx="80"
                  ry="80"
                />
                <path
                  fill="#fff"
                  d="M291.71,275.97c-1.87,0-3.73,1.87-3.73,4v40.27c0,2.13,1.87,3.73,3.73,3.73h44.28v132.27c0,1.87,1.87,3.73,4,3.73h47.21c2.13,0,3.73-1.87,3.73-3.73v-132.27h39.74c1.87,0,4-1.6,4.27-3.73l4-40.53c.27-1.87-1.33-3.73-3.73-3.73h-143.5Z"
                />
              </svg>
            </span>
            <div>
              <h1>Dashboard Leads/Contacts</h1>
              <p class="subtitle">Recherche et suivi de vos prospects/contacts</p>
            </div>
          </div>
          <div class="view-toggle" role="tablist">
            <button class="view-btn active" id="btnLeads" role="tab">
              Leads
            </button>
            <button class="view-btn" id="btnContacts" role="tab">
              Contacts
            </button>
          </div>
          <div class="hero-stat">
            <span class="stat-value" id="statTotal">—</span>
            <span class="stat-label" id="statLabel">Leads affichés</span>
          </div>
        </div>
      </header>

      <!-- Barre d'outils -->
      <section class="toolbar">
        <div class="search-wrap">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
          >
            <path
              d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Rechercher un lead (nom, société, email, téléphone…)"
            autocomplete="off"
          />
          <button class="clear-btn" id="clearBtn" title="Effacer" hidden>
            &times;
          </button>
        </div>
        <div class="filters">
          <select id="statusFilter">
            <option value="">Tous les statuts</option>
          </select>
          <button class="refresh-btn" id="refreshBtn" title="Rafraîchir">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                d="M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0114.85-3.36L23 10M1 14l4.65 4.36A9 9 0 0020.5 15"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Rafraîchir
          </button>
        </div>
      </section>

      <!-- Tableau -->
      <main class="content">
        <div class="table-wrap">
          <table class="leads-table">
            <thead>
              <tr>
                <th>Nom</th>
                <th>Société</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Statut</th>
                <th id="colSociete">Société</th>
                <th id="colStatut">Statut</th>
              </tr>
            </thead>
            <tbody id="leadsBody"></tbody>
          </table>
        </div>

        <div class="state" id="loadingState" hidden>
          <div class="spinner"></div>
          <p>Chargement des leads…</p>
        </div>

        <div class="state" id="emptyState" hidden>
          <svg
            class="state-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.35-4.35" stroke-linecap="round" />
          </svg>
          <p class="empty-title">Aucun lead trouvé</p>
          <p class="empty-sub">
            Modifiez votre recherche ou réinitialisez le filtre.
          </p>
        </div>

        <div class="state error-state" id="errorState" hidden>
          <p class="empty-title">Une erreur est survenue</p>
          <p class="empty-sub" id="errorMsg"></p>
        </div>
      </main>
    </div>

    <!-- Popup de détail -->
    <div class="modal-overlay" id="modalOverlay" hidden>
      <div
        class="modal-panel"
        id="modalPanel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <button class="modal-back" id="modalBack" aria-label="Retour" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="M15 19l-7-7 7-7"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button class="modal-close" id="modalClose" aria-label="Fermer">
          &times;
        </button>

        <div class="modal-views" id="modalViews">
          <div class="modal-view modal-view--main" id="modalViewMain">
            <div class="modal-header">
              <span class="modal-avatar" id="modalAvatar"></span>
              <h2 id="modalTitle">Détails</h2>
              <p class="modal-subtitle" id="modalSubtitle" hidden></p>
            </div>
            <div class="modal-body" id="modalBody"></div>
          </div>

          <div class="modal-view modal-view--deal" id="modalViewDeal">
            <div class="modal-header">
              <span class="modal-avatar" id="dealAvatar"></span>
              <h2 id="dealTitle">Affaire</h2>
              <p class="modal-subtitle" id="dealSubtitle" hidden></p>
            </div>
            <div class="modal-body" id="dealBody"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
